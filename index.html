<!DOCTYPE html>
<html>
<head>
    <title>Disaster Relief Donation & Distribution System</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
            background: linear-gradient(to right, #f0f4f8, #e6ebf1); /* soft gradient */
            color: #333;
        }

        header {
            background: linear-gradient(90deg, #1e3a5f, #27496d); /* gradient header */
            padding: 15px 40px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2); /* subtle shadow */
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 1px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
            padding: 0;
            margin: 0;
        }

        nav ul li {
            position: relative;
        }

        nav ul li a {
            color: #ffffff;
            text-decoration: none;
            padding: 8px 12px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        nav ul li a:hover {
            background-color: #ffffff;
            color: #1e3a5f;
            border-radius: 5px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .dropdown {
            display: none;
            position: absolute;
            background-color: #2c3e50;
            min-width: 180px;
            top: 35px;
            left: 0;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            animation: fadeIn 0.3s ease;
        }

        .dropdown li a {
            display: block;
            padding: 10px;
            color: #ffffff;
            transition: background 0.3s ease;
        }

        .dropdown li a:hover {
            background-color: #ffffff;
            color: #1e3a5f;
        }

        nav ul li:hover .dropdown {
            display: block;
        }

        main {
            display:flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 90vh;
            text-align: center;
            color: #1e3a5f;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 20px;
            animation: fadeInDown 1s ease;
        }

        .links a {
            display: inline-block;
            margin: 20px;
            padding: 14px 30px;
            background: linear-gradient(90deg, #1e3a5f, #27496d);
            color: whitesmoke;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .links a:hover {
            background-color: #ffffff;
            color: #1e3a5f;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        @keyframes fadeIn {
            from {opacity: 0;}
            to {opacity: 1;}
        }

        @keyframes fadeInDown {
            from {opacity: 0; transform: translateY(-20px);}
            to {opacity: 1; transform: translateY(0);}
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">Donation System</div>
            <ul>
                <li><a href="home.jsp">Home</a></li>
                <li>
                    <a href="#">Register</a>
                    <ul class="dropdown">
                        <li><a href="addDisaster.jsp">Add Disasters</a></li>
                        <li><a href="registerDonation.jsp">Donor & Donation</a></li>
                        <li><a href="distribution.jsp">Distribute</a></li>
                    </ul>
                </li>
                <li>
                    <a href="#">View</a>
                    <ul class="dropdown">
                        <li><a href="viewDonations.jsp">View Donations</a></li>
                        <li><a href="viewDisasters.jsp">View Disasters</a></li>
                        <li><a href="viewDistribution.jsp">View Distribution</a></li>
                    </ul>
                </li>
                <li><a href="reports.jsp">Relief Reports</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Welcome</h1>
        <div class="links">
            <a href="home.jsp">Get started</a>
        </div>
    </main>
</body>
</html>
